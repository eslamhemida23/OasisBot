name: Build OasisBot Manager

on:
  push:
    branches:
      - feature/oasisbot-manager
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build OasisBot Manager
        run: msbuild Manager/OasisBot.Manager.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build OasisBot with manager shutdown support
        run: msbuild Application/OasisBot/OasisBot.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build all plugins
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem "Plugins" -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.csproj" -File
          } | Sort-Object FullName)

          if ($projects.Count -eq 0) {
            throw "No plugin projects were found."
          }

          Write-Host "Building all $($projects.Count) plugin projects."
          foreach ($project in $projects) {
            Write-Host "Building plugin project: $($project.FullName)"
            & msbuild $project.FullName /restore /m /p:Configuration=Release /p:Platform=x86
            if ($LASTEXITCODE -ne 0) {
              throw "Plugin build failed: $($project.FullName)"
            }
          }

      - name: Build all botbases
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem "Botbases" -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.csproj" -File
          } | Sort-Object FullName)

          if ($projects.Count -eq 0) {
            throw "No botbase projects were found."
          }

          Write-Host "Building all $($projects.Count) botbase projects."
          foreach ($project in $projects) {
            Write-Host "Building botbase project: $($project.FullName)"
            & msbuild $project.FullName /restore /m /p:Configuration=Release /p:Platform=x86
            if ($LASTEXITCODE -ne 0) {
              throw "Botbase build failed: $($project.FullName)"
            }
          }

      - name: Verify and package outputs
        shell: pwsh
        run: |
          $managerOutput = "Manager/bin/x86/Release/net8.0-windows"
          $managerExe = Join-Path $managerOutput "OasisBot.Manager.exe"
          $requiredBotFiles = @(
            "Build/OasisBot.exe",
            "Build/OasisBot.dll",
            "Build/RSBot.Core.dll",
            "Build/SDUI.dll",
            "Build/Data/Plugins/RSBot.XControl.dll",
            "Build/Data/Plugins/RSBot.General.dll",
            "Build/Data/Plugins/RSBot.Party.dll",
            "Build/Data/Bots/RSBot.Training.dll"
          )

          if (!(Test-Path $managerExe)) {
            throw "Missing Manager executable: $managerExe"
          }

          foreach ($file in $requiredBotFiles) {
            if (!(Test-Path $file)) {
              throw "Missing updated bot runtime file: $file"
            }
          }

          $stage = "OasisBot-Manager-Bundle"
          New-Item -ItemType Directory -Force -Path "$stage/Manager", "$stage/BotUpdate" | Out-Null
          Copy-Item "$managerOutput/*" "$stage/Manager/" -Recurse -Force

          # The bot logic lives in OasisBot.dll and RSBot.Core.dll, not only in the apphost EXE.
          # Copy every top-level runtime file and folder, but preserve the user's Data and User folders.
          Get-ChildItem "Build" -Force |
            Where-Object { $_.Name -notin @("Data", "User") } |
            ForEach-Object {
              Copy-Item $_.FullName "$stage/BotUpdate/" -Recurse -Force
            }

          foreach ($file in $requiredBotFiles | Where-Object { $_ -notlike "Build/Data/*" }) {
            $name = Split-Path $file -Leaf
            if (!(Test-Path "$stage/BotUpdate/$name")) {
              throw "Bot update bundle is missing: $name"
            }
          }

          # Include the complete plugin and botbase sets. These are the assemblies
          # that populate the application's tabs and the botbase selector.
          New-Item -ItemType Directory -Force -Path "$stage/BotUpdate/Data/Plugins", "$stage/BotUpdate/Data/Bots" | Out-Null

          $pluginProjects = @(Get-ChildItem "Plugins" -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.csproj" -File
          })
          $botbaseProjects = @(Get-ChildItem "Botbases" -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.csproj" -File
          })
          $pluginAssemblies = @(Get-ChildItem "Build/Data/Plugins" -Filter "*.dll" -File)
          $botbaseAssemblies = @(Get-ChildItem "Build/Data/Bots" -Filter "*.dll" -File)

          foreach ($project in $pluginProjects) {
            $expected = Join-Path "Build/Data/Plugins" ($project.BaseName + ".dll")
            if (!(Test-Path $expected)) {
              throw "Plugin project $($project.BaseName) did not produce its expected DLL: $expected"
            }
          }
          foreach ($project in $botbaseProjects) {
            $expected = Join-Path "Build/Data/Bots" ($project.BaseName + ".dll")
            if (!(Test-Path $expected)) {
              throw "Botbase project $($project.BaseName) did not produce its expected DLL: $expected"
            }
          }

          if ($pluginAssemblies.Count -lt $pluginProjects.Count) {
            throw "Only $($pluginAssemblies.Count) plugin DLLs were built for $($pluginProjects.Count) plugin projects."
          }
          if ($botbaseAssemblies.Count -lt $botbaseProjects.Count) {
            throw "Only $($botbaseAssemblies.Count) botbase DLLs were built for $($botbaseProjects.Count) botbase projects."
          }

          Write-Host "Packaging $($pluginAssemblies.Count) plugin DLLs from $($pluginProjects.Count) projects."
          Write-Host "Packaging $($botbaseAssemblies.Count) botbase DLLs from $($botbaseProjects.Count) projects."

          # Copy the complete generated Data runtime tree, not just a hand-picked
          # subset of DLLs. This carries every plugin, botbase, plugin dependency,
          # and generated runtime data file into the update while leaving user files
          # outside the package untouched.
          Copy-Item "Build/Data/*" "$stage/BotUpdate/Data/" -Recurse -Force

          # Training is a botbase, not a plugin. Do not ship a stale duplicate
          # under Data/Plugins where it could be loaded before the botbase copy.
          if (Test-Path "$stage/BotUpdate/Data/Plugins/RSBot.Training.dll") {
            Remove-Item "$stage/BotUpdate/Data/Plugins/RSBot.Training.dll" -Force
          }

          if (!(Test-Path "$stage/BotUpdate/Data/Bots/RSBot.Training.dll")) {
            throw "Bot update bundle is missing RSBot.Training.dll."
          }
          foreach ($project in $botbaseProjects) {
            $expected = Join-Path "$stage/BotUpdate/Data/Bots" ($project.BaseName + ".dll")
            if (!(Test-Path $expected)) {
              throw "Bot update bundle is missing botbase assembly for $($project.BaseName): $expected"
            }
          }

          # RSBot.General is dynamically loaded from Data/Plugins and references
          # WebView2 with PrivateAssets=all, so these runtime dependencies do not
          # flow into the main OasisBot application output automatically.
          $webView2Assemblies = @(
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.WinForms.dll"
          )
          foreach ($assembly in $webView2Assemblies) {
            $source = Get-ChildItem "Build/Data/Plugins" -Filter $assembly -Recurse -File |
              Select-Object -First 1
            if ($null -eq $source) {
              throw "Missing General plugin runtime dependency: $assembly"
            }
            Copy-Item $source.FullName "$stage/BotUpdate/$assembly" -Force
            if (!(Test-Path "$stage/BotUpdate/$assembly")) {
              throw "Bot update bundle is missing WebView2 dependency: $assembly"
            }
          }

          $webView2Loader = Get-ChildItem "Build/Data/Plugins" -Filter "WebView2Loader.dll" -Recurse -File |
            Where-Object { $_.FullName -match "(?i)win-x86|\\x86\\" } |
            Select-Object -First 1
          if ($null -eq $webView2Loader) {
            $webView2Loader = Get-ChildItem "Build/Data/Plugins" -Filter "WebView2Loader.dll" -Recurse -File |
              Select-Object -First 1
          }
          if ($null -eq $webView2Loader) {
            throw "Missing WebView2 native loader (WebView2Loader.dll) for the x86 bot."
          }

          # Keep a copy at the application base for the P/Invoke loader, and retain
          # the NuGet runtime layout in case the native resolver uses it.
          Copy-Item $webView2Loader.FullName "$stage/BotUpdate/WebView2Loader.dll" -Force
          $nativeRelativePath = "runtimes/win-x86/native/WebView2Loader.dll"
          New-Item -ItemType Directory -Force -Path (Join-Path "$stage/BotUpdate" (Split-Path $nativeRelativePath -Parent)) | Out-Null
          Copy-Item $webView2Loader.FullName (Join-Path "$stage/BotUpdate" $nativeRelativePath) -Force

          Compress-Archive -Path "$stage/*" -DestinationPath "OasisBot-Manager-Bundle.zip" -Force
          $filesToReport = @($managerExe) + $requiredBotFiles + @("OasisBot-Manager-Bundle.zip")
          Get-Item $filesToReport |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Manager bundle
        uses: actions/upload-artifact@v4
        with:
          name: OasisBot-Manager-Bundle
          path: OasisBot-Manager-Bundle.zip
          if-no-files-found: error
          retention-days: 14
