name: Build OasisBot Manager

on:
  push:
    branches:
      - feature/oasisbot-manager
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build OasisBot Manager
        run: msbuild Manager/OasisBot.Manager.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build OasisBot with manager shutdown support
        run: msbuild Application/OasisBot/OasisBot.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build General plugin
        run: msbuild Plugins/RSBot.General/RSBot.General.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build Party plugin
        run: msbuild Plugins/RSBot.Party/RSBot.Party.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build Training botbase
        run: msbuild Botbases/RSBot.Training/RSBot.Training.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build xControl party command plugin
        run: msbuild Plugins/RSBot.XControl/RSBot.XControl.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Verify and package outputs
        shell: pwsh
        run: |
          $managerOutput = "Manager/bin/x86/Release/net8.0-windows"
          $managerExe = Join-Path $managerOutput "OasisBot.Manager.exe"
          $requiredBotFiles = @(
            "Build/OasisBot.exe",
            "Build/OasisBot.dll",
            "Build/RSBot.Core.dll",
            "Build/SDUI.dll",
            "Build/Data/Plugins/RSBot.XControl.dll",
            "Build/Data/Plugins/RSBot.General.dll",
            "Build/Data/Plugins/RSBot.Party.dll",
            "Build/Data/Bots/RSBot.Training.dll"
          )

          if (!(Test-Path $managerExe)) {
            throw "Missing Manager executable: $managerExe"
          }

          foreach ($file in $requiredBotFiles) {
            if (!(Test-Path $file)) {
              throw "Missing updated bot runtime file: $file"
            }
          }

          $stage = "OasisBot-Manager-Bundle"
          New-Item -ItemType Directory -Force -Path "$stage/Manager", "$stage/BotUpdate" | Out-Null
          Copy-Item "$managerOutput/*" "$stage/Manager/" -Recurse -Force

          # The bot logic lives in OasisBot.dll and RSBot.Core.dll, not only in the apphost EXE.
          # Copy every top-level runtime file and folder, but preserve the user's Data and User folders.
          Get-ChildItem "Build" -Force |
            Where-Object { $_.Name -notin @("Data", "User") } |
            ForEach-Object {
              Copy-Item $_.FullName "$stage/BotUpdate/" -Recurse -Force
            }

          foreach ($file in $requiredBotFiles | Where-Object { $_ -notlike "Build/Data/*" }) {
            $name = Split-Path $file -Leaf
            if (!(Test-Path "$stage/BotUpdate/$name")) {
              throw "Bot update bundle is missing: $name"
            }
          }

          # Preserve all existing user data, but stage each runtime component changed by
          # this branch so its new DLL reaches the correct OasisBot loader directory.
          New-Item -ItemType Directory -Force -Path "$stage/BotUpdate/Data/Plugins", "$stage/BotUpdate/Data/Bots" | Out-Null

          $updatedPlugins = @(
            "RSBot.XControl.dll",
            "RSBot.General.dll",
            "RSBot.Party.dll"
          )
          foreach ($plugin in $updatedPlugins) {
            $source = "Build/Data/Plugins/$plugin"
            $destination = "$stage/BotUpdate/Data/Plugins/$plugin"
            if (!(Test-Path $source)) {
              throw "Missing updated plugin runtime file: $source"
            }
            Copy-Item $source $destination -Force
            if (!(Test-Path $destination)) {
              throw "Bot update bundle is missing $destination."
            }
          }

          Copy-Item "Build/Data/Bots/RSBot.Training.dll" "$stage/BotUpdate/Data/Bots/RSBot.Training.dll" -Force
          if (!(Test-Path "$stage/BotUpdate/Data/Bots/RSBot.Training.dll")) {
            throw "Bot update bundle is missing the updated RSBot.Training.dll."
          }

          # RSBot.General is dynamically loaded from Data/Plugins and references
          # WebView2 with PrivateAssets=all, so these runtime dependencies do not
          # flow into the main OasisBot application output automatically.
          $webView2Assemblies = @(
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.WinForms.dll"
          )
          foreach ($assembly in $webView2Assemblies) {
            $source = Get-ChildItem "Build/Data/Plugins" -Filter $assembly -Recurse -File |
              Select-Object -First 1
            if ($null -eq $source) {
              throw "Missing General plugin runtime dependency: $assembly"
            }
            Copy-Item $source.FullName "$stage/BotUpdate/$assembly" -Force
            if (!(Test-Path "$stage/BotUpdate/$assembly")) {
              throw "Bot update bundle is missing WebView2 dependency: $assembly"
            }
          }

          $webView2Loader = Get-ChildItem "Build/Data/Plugins" -Filter "WebView2Loader.dll" -Recurse -File |
            Where-Object { $_.FullName -match "(?i)win-x86|\\x86\\" } |
            Select-Object -First 1
          if ($null -eq $webView2Loader) {
            $webView2Loader = Get-ChildItem "Build/Data/Plugins" -Filter "WebView2Loader.dll" -Recurse -File |
              Select-Object -First 1
          }
          if ($null -eq $webView2Loader) {
            throw "Missing WebView2 native loader (WebView2Loader.dll) for the x86 bot."
          }

          # Keep a copy at the application base for the P/Invoke loader, and retain
          # the NuGet runtime layout in case the native resolver uses it.
          Copy-Item $webView2Loader.FullName "$stage/BotUpdate/WebView2Loader.dll" -Force
          $nativeRelativePath = "runtimes/win-x86/native/WebView2Loader.dll"
          New-Item -ItemType Directory -Force -Path (Join-Path "$stage/BotUpdate" (Split-Path $nativeRelativePath -Parent)) | Out-Null
          Copy-Item $webView2Loader.FullName (Join-Path "$stage/BotUpdate" $nativeRelativePath) -Force

          Compress-Archive -Path "$stage/*" -DestinationPath "OasisBot-Manager-Bundle.zip" -Force
          $filesToReport = @($managerExe) + $requiredBotFiles + @("OasisBot-Manager-Bundle.zip")
          Get-Item $filesToReport |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Manager bundle
        uses: actions/upload-artifact@v4
        with:
          name: OasisBot-Manager-Bundle
          path: OasisBot-Manager-Bundle.zip
          if-no-files-found: error
          retention-days: 14
