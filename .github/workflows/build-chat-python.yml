name: Build Chat and Python plugins

on:
  push:
    branches:
      - feature/python-api-expansion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build RSBot.Chat
        run: msbuild Plugins/RSBot.Chat/RSBot.Chat.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build RSBot.XControl
        run: msbuild Plugins/RSBot.XControl/RSBot.XControl.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Build RSBot.Python
        run: msbuild Plugins/RSBot.Python/RSBot.Python.csproj /restore /m /p:Configuration=Release /p:Platform=x86

      - name: Stage Python API test plugin
        shell: pwsh
        run: |
          $pluginDir = "Build/Data/Python/Plugins"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item "Plugins/RSBot.Python/Examples/OasisApiTest.py" "$pluginDir/OasisApiTest.py" -Force
          if (!(Test-Path "$pluginDir/OasisApiTest.py")) {
            throw "Python API test plugin was not staged."
          }

      - name: Verify output DLLs
        shell: pwsh
        run: |
          $chat = "Build/Data/Plugins/RSBot.Chat.dll"
          $python = "Build/Data/Plugins/RSBot.Python.dll"
          $xcontrol = "Build/Data/Plugins/RSBot.XControl.dll"
          if (!(Test-Path $chat)) { throw "Missing build output: $chat" }
          if (!(Test-Path $python)) { throw "Missing build output: $python" }
          if (!(Test-Path $xcontrol)) { throw "Missing build output: $xcontrol" }
          if (!(Test-Path "Build/Data/Python/Plugins/OasisApiTest.py")) {
            throw "Missing staged Python API test plugin."
          }
          Get-Item $chat, $python, $xcontrol, "Build/Data/Python/Plugins/OasisApiTest.py" |
            Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Upload compiled DLLs
        uses: actions/upload-artifact@v4
        with:
          name: OasisBot-Chat-Python-XControl-DLLs
          path: |
            Build/Data/Plugins/RSBot.Chat.dll
            Build/Data/Plugins/RSBot.Python.dll
            Build/Data/Plugins/RSBot.XControl.dll
            Build/Data/Python/Plugins/OasisApiTest.py
          if-no-files-found: error
          retention-days: 7
